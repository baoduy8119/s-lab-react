version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - DATABASE_URL=postgresql://dev:dev123@100.70.44.30:5432/slab?schema=public
        - DASHBOARD_USERNAME=admin
        - DASHBOARD_PASSWORD=slab2026
        - DASHBOARD_SESSION_SECRET=${DASHBOARD_SESSION_SECRET}
    container_name: sLab
    ports:
      - "8010:3000"
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
      DASHBOARD_SESSION_SECRET: ${DASHBOARD_SESSION_SECRET}
